# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: critical-thinking
builds:
  - dir: ./cmd/critical-thinking
    main: .
    binary: critical-thinking
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
archives:
  - name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: "checksums.txt"
release:
  # release-please creates the tag, the GitHub Release and its notes; goreleaser
  # (ci-binaries.yml, run on the tag) only attaches the archives and checksums.
  # keep-existing: never overwrite the notes release-please wrote.
  mode: keep-existing
changelog:
  # release-please owns CHANGELOG.md and the release notes.
  disable: true
