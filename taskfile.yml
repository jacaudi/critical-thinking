version: '3'

vars:
  BINARY: critical-thinking
  PKG: ./cmd/critical-thinking
  # Fall back when there is no usable .git (e.g. a worktree checkout mounted
  # into a container) so every target still runs.
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: -s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}
  # Pinned tool versions. `go run` builds each with the current Go toolchain
  # (a prebuilt golangci-lint built with an older Go refuses a newer go.mod).
  GOLANGCI_LINT: github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
  GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.7.0

tasks:
  build:
    desc: Build the binary into bin/
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/{{.BINARY}} {{.PKG}}
  test:
    desc: go test ./...
    cmds:
      - go test ./...
  test-race:
    desc: Race detector + coverage, no test cache (the standard mode here)
    cmds:
      - go test -race -count=1 -coverprofile=coverage.txt ./...
  gofmt:
    desc: Fail if any Go file is not gofmt-clean
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "gofmt found unformatted files:"
          echo "$unformatted"
          gofmt -d .
          exit 1
        fi
  vet:
    desc: go vet ./...
    cmds:
      - go vet ./...
  lint:
    desc: golangci-lint (pinned) over the module
    cmds:
      - go run {{.GOLANGCI_LINT}} run ./...
  vulncheck:
    desc: govulncheck (pinned) over the module
    cmds:
      - go run {{.GOVULNCHECK}} ./...
  lint:plugin:
    desc: shellcheck the plugin scripts and validate its JSON
    cmds:
      - shellcheck plugins/critical-thinking/hooks/*.sh plugins/critical-thinking/test/*.sh
      - 'for f in plugins/critical-thinking/.mcp.json plugins/critical-thinking/hooks/hooks.json plugins/critical-thinking/.claude-plugin/plugin.json; do jq -e . "$f" >/dev/null; done'
  test:plugin:
    desc: Run the plugin shell tests
    cmds:
      - bash plugins/critical-thinking/test/hooks_json_test.sh
      - bash plugins/critical-thinking/test/install-binary_test.sh
      - bash plugins/critical-thinking/test/activate_test.sh
  ci:
    desc: Everything CI runs, in CI's order (keep in sync with .github/actions/tests/action.yml)
    cmds:
      - task: gofmt
      - task: vet
      - task: lint
      - task: vulncheck
      - task: lint:plugin
      - task: test:plugin
      - task: test-race
      - task: build
  clean:
    desc: Remove build and coverage artifacts
    cmds:
      - rm -rf bin/ coverage.txt
