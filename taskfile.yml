# THE CI CONTRACT — generated per repo; `task ci` is what CI runs and what you run locally. Rationale: github-actions-align/templates/README.md#taskfiles
version: '3'

vars:
  BINARY: critical-thinking
  PKG: ./cmd/critical-thinking
  # Fall back when there is no usable .git (e.g. a worktree checkout mounted
  # into a container) so every target still runs.
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: -s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}

includes:
  repo:
    taskfile: .taskfiles/repo.yml

  # --- generated: one entry per language present; `dir:` for non-Go ---
  go:
    taskfile: .taskfiles/go.yml

  # LOCAL ADDITION to the github-actions-align template: the Claude Code plugin
  # under plugins/ is shell + JSON, which no language module covers. Its checks
  # live in their own module so they are part of the contract (`task ci`)
  # rather than a workflow-only step.
  plugin:
    taskfile: .taskfiles/plugin.yml

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list

  ci:
    desc: Everything CI runs. Run this before pushing.
    cmds:
      - task: repo:ci
      - task: go:ci
      - task: plugin:ci

  lint:
    desc: Static checks only
    cmds:
      - task: repo:ci
      - task: go:lint
      - task: plugin:lint

  test:
    desc: Tests only
    cmds:
      - task: go:test
      - task: plugin:test

  # LOCAL DIVERGENCE from the template's `go:build`: the binary is stamped with
  # the git version, commit and date (surfaced by `/health` and the MCP
  # Implementation.Version), the same -X flags the Dockerfile passes.
  build:
    desc: Build the binary into bin/, stamped with the git version
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/{{.BINARY}} {{.PKG}}

  # Service repo. Runs locally: IMAGE=ghcr.io/jacaudi/critical-thinking:vX.Y.Z task smoke
  smoke:
    desc: Boot the built image and assert it behaves
    requires:
      vars: [IMAGE]
    # Accepts BOTH `IMAGE=… task smoke` and `task smoke IMAGE=…`. Without this,
    # the CLI form satisfies `requires` but leaves $IMAGE empty in the shell.
    env:
      IMAGE: '{{.IMAGE}}'
    cmds:
      - |
        set -eu
        echo "smoke testing ${IMAGE}"
        # Boot exactly as docs/clients.md tells users to: the image's own CMD
        # (`serve --http :3000`) with the port published, nothing else.
        docker run -d --name smoke -p 3000:3000 "${IMAGE}"
        trap 'docker logs smoke || true; docker rm -f smoke >/dev/null 2>&1 || true' EXIT
        for i in $(seq 1 30); do
          curl -sf http://localhost:3000/health >/dev/null && break
          [ "$i" = "30" ] && { echo "::error::container never served /health on :3000"; exit 1; }
          sleep 2
        done
        echo "ok: container serves /health"
        # The health body carries the stamped version; an image built without
        # the VERSION build-arg reports "dev", which is the one regression
        # `docker run` alone cannot catch.
        body=$(curl -sf http://localhost:3000/health)
        echo "${body}"
        case "${body}" in
          *'"status":"ok"'*) echo "ok: status is ok" ;;
          *) echo "::error::/health did not report status ok"; exit 1 ;;
        esac

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/
