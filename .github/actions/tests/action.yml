name: "Tests"
description: "Run `task ci` — the taskfile is the CI contract"

# Interim shape: the toolchains and lint tools come from the shared setup
# action so this composite runs exactly `task ci`, the same command the dev
# container runs. The workflow swap that retires this action follows in the
# next PR (github-actions-align, step 4).
runs:
  using: "composite"
  steps:
    - name: Set up toolchains
      uses: ./.github/actions/setup
      with:
        repo-token: ${{ github.token }}

    - name: task ci
      shell: bash
      run: task ci
