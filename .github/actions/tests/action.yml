name: "Tests"
description: "Run Go tests for the MCP server"

runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
      with:
        go-version: '1.26'
        cache: true

    - name: Setup Task
      uses: arduino/setup-task@v2
      with:
        version: 3.x
        repo-token: ${{ github.token }}

    # Every step below is a taskfile target so CI and the dev container
    # (.devcontainer/) run one command set. Keep this step list identical, in
    # order, to the `ci` task in taskfile.yml; the split into steps exists only
    # for per-step log grouping.
    - name: gofmt
      shell: bash
      run: task gofmt

    - name: vet
      shell: bash
      run: task vet

    - name: golangci-lint
      shell: bash
      run: task lint

    - name: govulncheck
      shell: bash
      run: task vulncheck

    - name: plugin lint + tests
      shell: bash
      run: |
        task lint:plugin
        task test:plugin

    - name: test (race + coverage)
      shell: bash
      run: task test-race

    - name: build
      shell: bash
      run: task build
